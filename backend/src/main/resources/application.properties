# Spring Boot Server Port
server.port=8080

# Application Name
spring.application.name=Employee Management System

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Make sure your MySQL server is running and database 'employeedb' is created:
# Run in MySQL: CREATE DATABASE IF NOT EXISTS employeedb;
spring.datasource.url=jdbc:mysql://localhost:3306/employeedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional SQL Script initialization to seed default departments/employees on first run
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.com.example.ems=DEBUG
logging.level.org.hibernate.SQL=DEBUG
