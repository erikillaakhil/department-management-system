# Spring Boot Production Profile (used inside Docker container)
server.port=8080

# MySQL connection — uses Docker service name 'mysql' as hostname
spring.datasource.url=jdbc:mysql://mysql:3306/employeedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Seed data
spring.sql.init.mode=always

# Logging — quieter in production
logging.level.root=WARN
logging.level.com.example.ems=INFO
