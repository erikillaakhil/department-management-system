# Spring Boot Production Profile (Railway + Aiven MySQL)
server.port=${PORT:8080}

# Aiven MySQL — SSL REQUIRED
# Set these as environment variables in Railway dashboard
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-30493f06-erikillaakhil-b43a.b.aivencloud.com:17446/defaultdb?useSSL=true&requireSSL=true&sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Seed data (creates tables + inserts sample data on first run)
spring.sql.init.mode=always

# CORS allowed origins (set via env var in Railway)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.root=WARN
logging.level.com.example.ems=INFO
